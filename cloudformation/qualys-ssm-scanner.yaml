AWSTemplateFormatVersion: '2010-09-09'
Description: Qualys SSM Scanner - Automated EC2 vulnerability scanning via SSM

Parameters:
  QualysAccessToken:
    Type: String
    NoEcho: true
    Description: Qualys API access token

  QualysPod:
    Type: String
    Default: US2
    AllowedValues: [US1, US2, US3, US4, EU1, EU2, EU3, IN1, CA1, AE1, UK1, AU1]

  QScannerSource:
    Type: String
    Default: s3
    AllowedValues: [s3, url]
    Description: Source for QScanner binary (s3 = from ResultsBucket, url = from QScannerDownloadUrl)

  QScannerDownloadUrl:
    Type: String
    Default: ''
    Description: URL to download QScanner (if QScannerSource=url)

  ScanTypes:
    Type: String
    Default: os,sca,fileinsight

  EnableNewEC2Trigger:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  EnableScheduledScan:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  ScheduleExpression:
    Type: String
    Default: cron(0 2 * * ? *)

  NewInstanceDelay:
    Type: Number
    Default: 60
    MinValue: 30
    MaxValue: 300

Conditions:
  CreateNewEC2Trigger: !Equals [!Ref EnableNewEC2Trigger, 'true']
  CreateScheduledTrigger: !Equals [!Ref EnableScheduledScan, 'true']
  UseS3Source: !Equals [!Ref QScannerSource, 's3']

Resources:
  QualysSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/qualys-token
      SecretString: !Sub '{"access_token":"${QualysAccessToken}","pod":"${QualysPod}"}'

  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireResults
            Status: Enabled
            ExpirationInDays: 90

  ResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResultsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ResultsBucket.Arn
              - !Sub ${ResultsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  SSMDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub ${AWS::StackName}-scan
      DocumentType: Command
      DocumentFormat: YAML
      Content:
        schemaVersion: '2.2'
        description: Qualys QScanner RootFS scan
        parameters:
          Pod:
            type: String
            default: !Ref QualysPod
          ScanTypes:
            type: String
            default: !Ref ScanTypes
          S3Bucket:
            type: String
            default: !Ref ResultsBucket
          SecretArn:
            type: String
            default: !Ref QualysSecret
          QScannerSource:
            type: String
            default: !Ref QScannerSource
          QScannerUrl:
            type: String
            default: !Ref QScannerDownloadUrl
        mainSteps:
          - action: aws:runShellScript
            name: scan
            precondition:
              StringEquals: [platformType, Linux]
            inputs:
              timeoutSeconds: '900'
              runCommand:
                - |
                  #!/bin/bash
                  set -e

                  QSCANNER="/opt/qualys/qscanner"
                  mkdir -p /opt/qualys

                  TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" 2>/dev/null || true)
                  if [ -n "$TOKEN" ]; then
                    INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                    REGION=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
                    INSTANCE_TYPE=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-type)
                  else
                    INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
                    REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)
                    INSTANCE_TYPE=$(curl -s http://169.254.169.254/latest/meta-data/instance-type)
                  fi

                  ARCH=$(uname -m)
                  case $ARCH in
                    x86_64) PLATFORM="linux-amd64" ;;
                    aarch64|arm64) PLATFORM="linux-arm64" ;;
                    *) echo "Unsupported: $ARCH"; exit 1 ;;
                  esac

                  if [ ! -f "$QSCANNER" ]; then
                    if [ "{{ QScannerSource }}" = "s3" ]; then
                      aws s3 cp "s3://{{ S3Bucket }}/qscanner/qscanner-${PLATFORM}" $QSCANNER --region $REGION
                    else
                      curl -sL "{{ QScannerUrl }}/qscanner-${PLATFORM}" -o $QSCANNER
                    fi
                    chmod +x $QSCANNER
                  fi

                  export QUALYS_ACCESS_TOKEN=$(aws secretsmanager get-secret-value --secret-id "{{ SecretArn }}" --region $REGION --query 'SecretString' --output text | jq -r '.access_token')

                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  OUTPUT="/tmp/qscanner-${INSTANCE_ID}-${TIMESTAMP}"
                  mkdir -p $OUTPUT

                  $QSCANNER \
                    --pod {{ Pod }} \
                    --mode get-report \
                    --scan-types {{ ScanTypes }} \
                    --shell-commands "uname -a=$(uname -a)" \
                    --exclude-dirs /proc,/sys,/dev,/run,/tmp,/var/lib/docker \
                    --scan-target-info "instance_id=${INSTANCE_ID}" \
                    --scan-target-info "region=${REGION}" \
                    --scan-target-info "instance_type=${INSTANCE_TYPE}" \
                    --report-format json,sarif \
                    -o $OUTPUT \
                    rootfs /

                  aws s3 cp $OUTPUT/ "s3://{{ S3Bucket }}/scans/${INSTANCE_ID}/${TIMESTAMP}/" --recursive --region $REGION
                  rm -rf $OUTPUT

  TriggerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SSMScanner
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:SendCommand, ssm:DescribeInstanceInformation]
                Resource: '*'
              - Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeTags]
                Resource: '*'

  TriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-trigger
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt TriggerLambdaRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          SSM_DOCUMENT: !Ref SSMDocument
          NEW_INSTANCE_DELAY: !Ref NewInstanceDelay
      Code:
        ZipFile: |
          import boto3, json, os, time, logging
          from datetime import datetime

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          ssm = boto3.client('ssm')
          ec2 = boto3.client('ec2')
          SSM_DOC = os.environ['SSM_DOCUMENT']
          DELAY = int(os.environ.get('NEW_INSTANCE_DELAY', 60))

          def handler(event, context):
              logger.info(json.dumps(event))
              event_type, ids = parse(event)
              if not ids:
                  return {'status': 'no_targets'}
              ready = wait_ssm(ids, DELAY) if event_type == 'new_ec2' else check_ssm(ids)
              if not ready:
                  return {'status': 'not_ready'}
              cmd = ssm.send_command(InstanceIds=ready, DocumentName=SSM_DOC, TimeoutSeconds=900, MaxConcurrency='10', MaxErrors='25%')
              return {'status': 'started', 'commandId': cmd['Command']['CommandId'], 'instances': ready}

          def parse(event):
              if event.get('detail-type') == 'EC2 Instance State-change Notification':
                  if event['detail']['state'] == 'running':
                      iid = event['detail']['instance-id']
                      if not is_disabled(iid):
                          return 'new_ec2', [iid]
                  return 'skip', []
              if event.get('detail-type') == 'Scheduled Event':
                  return 'scheduled', get_tagged()
              if 'instance_ids' in event:
                  return 'manual', event['instance_ids']
              if event.get('scan_type') == 'fleet':
                  return 'fleet', get_tagged()
              return 'unknown', []

          def is_disabled(iid):
              try:
                  r = ec2.describe_instances(InstanceIds=[iid])
                  for res in r['Reservations']:
                      for i in res['Instances']:
                          tags = {t['Key']: t['Value'] for t in i.get('Tags', [])}
                          if tags.get('QualysScan', '').lower() == 'disabled':
                              return True
                  return False
              except:
                  return False

          def get_tagged():
              try:
                  r = ec2.describe_instances(Filters=[{'Name': 'instance-state-name', 'Values': ['running']}, {'Name': 'tag:QualysScan', 'Values': ['enabled', 'true']}])
                  return [i['InstanceId'] for res in r['Reservations'] for i in res['Instances']]
              except:
                  return []

          def check_ssm(ids):
              if not ids:
                  return []
              try:
                  r = ssm.describe_instance_information(Filters=[{'Key': 'InstanceIds', 'Values': ids[:50]}])
                  return [i['InstanceId'] for i in r['InstanceInformationList'] if i['PingStatus'] == 'Online']
              except:
                  return []

          def wait_ssm(ids, timeout):
              start = time.time()
              while time.time() - start < timeout:
                  ready = check_ssm(ids)
                  if ready:
                      return ready
                  time.sleep(10)
              return check_ssm(ids)

  NewEC2Rule:
    Type: AWS::Events::Rule
    Condition: CreateNewEC2Trigger
    Properties:
      Name: !Sub ${AWS::StackName}-new-ec2
      EventPattern:
        source: [aws.ec2]
        detail-type: [EC2 Instance State-change Notification]
        detail:
          state: [running]
      Targets:
        - Id: Lambda
          Arn: !GetAtt TriggerLambda.Arn

  NewEC2Permission:
    Type: AWS::Lambda::Permission
    Condition: CreateNewEC2Trigger
    Properties:
      FunctionName: !Ref TriggerLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NewEC2Rule.Arn

  ScheduledRule:
    Type: AWS::Events::Rule
    Condition: CreateScheduledTrigger
    Properties:
      Name: !Sub ${AWS::StackName}-scheduled
      ScheduleExpression: !Ref ScheduleExpression
      Targets:
        - Id: Lambda
          Arn: !GetAtt TriggerLambda.Arn

  ScheduledPermission:
    Type: AWS::Lambda::Permission
    Condition: CreateScheduledTrigger
    Properties:
      FunctionName: !Ref TriggerLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledRule.Arn

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-ec2
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: QualysScanner
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${ResultsBucket.Arn}/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref QualysSecret

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${AWS::StackName}-ec2
      Roles: [!Ref EC2Role]

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/ssm/${AWS::StackName}
      RetentionInDays: 30

Outputs:
  ResultsBucket:
    Value: !Ref ResultsBucket
    Export:
      Name: !Sub ${AWS::StackName}-bucket

  SecretArn:
    Value: !Ref QualysSecret

  SSMDocument:
    Value: !Ref SSMDocument

  TriggerLambda:
    Value: !Ref TriggerLambda

  EC2InstanceProfile:
    Value: !Ref EC2InstanceProfile
    Export:
      Name: !Sub ${AWS::StackName}-instance-profile

  UploadQScannerCommand:
    Value: !Sub |
      aws s3 cp qscanner-linux-amd64 s3://${ResultsBucket}/qscanner/
      aws s3 cp qscanner-linux-arm64 s3://${ResultsBucket}/qscanner/

  ScanInstanceCommand:
    Value: !Sub aws lambda invoke --function-name ${TriggerLambda} --payload '{"instance_ids":["i-xxx"]}' /dev/stdout

  ScanFleetCommand:
    Value: !Sub aws lambda invoke --function-name ${TriggerLambda} --payload '{"scan_type":"fleet"}' /dev/stdout
